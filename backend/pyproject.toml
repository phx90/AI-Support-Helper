[project]
name = "ai-support-hub-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3", "python-multipart>=0.0.17,<1", "pypdf>=5.1,<6",
  "python-docx>=1.1,<2", "openai>=1.57,<2", "anthropic>=0.40,<1",
  "langchain-core>=0.3,<1", "langgraph>=0.2,<1", "httpx>=0.27,<1",
  "structlog>=24.4,<26", "tenacity>=9,<10"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.8,<1", "mypy>=1.13,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-ignore = ["B008", "E501"]
