[project]
name = "ai-support-hub-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.0,<1", "uvicorn[standard]>=0.54.0,<1", "sqlalchemy>=2.1.4,<3",
  "psycopg[binary]>=3.3.6,<4", "pgvector>=0.5.1,<1", "alembic>=1.20.0,<2",
  "pydantic-settings>=2.15.0,<3", "python-multipart>=0.0.32,<1", "pypdf>=6.20.0,<7",
  "python-docx>=1.2.0,<2", "openai>=3.28.0,<4", "anthropic>=1.13.0,<2",
  "langchain-core>=1.6.9,<2", "langgraph>=1.2.14,<2", "httpx>=0.28.1,<1",
  "structlog>=26.1.0,<27", "tenacity>=9.2.1,<10"
]
[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "ruff>=0.17.0,<1", "mypy>=2.4.0,<3"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-ignore = ["B008", "E501"]
