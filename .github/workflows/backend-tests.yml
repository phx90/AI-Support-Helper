name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_support_hub
          POSTGRES_USER: ai_support
          POSTGRES_PASSWORD: ai_support_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_support -d ai_support_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ai_support:ai_support_dev@localhost:5432/ai_support_hub
      LLM_MOCK_MODE: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Validate formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
